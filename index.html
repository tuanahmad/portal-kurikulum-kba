<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Guru — Kuttab Budi Ashari</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FBFAF7" />
    <script>
      // Tema terang/gelap dipasang SEBELUM halaman tergambar supaya tidak berkedip. Pilihan: "otomatis" (ikut HP, bawaan) / "terang" / "gelap".
      (function () {
        try {
          var p = localStorage.getItem("tema") || "otomatis";
          var g = p === "gelap" || (p === "otomatis" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-tema", g ? "gelap" : "terang");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", g ? "#0F1713" : "#FBFAF7");
        } catch (e) {}
      })();
    </script>
    <style>
      :root { --c-green: #1C4A33; --c-greenDeep: #143726; --c-gold: #C79A3B; --c-goldSoft: #F3E8D2; --c-mist: #FBFAF7; --c-leaf: #EDF3EE; --c-ink: #22301F; --c-muted: #68705F; --c-line: #E2DFD5; --c-card: #FFFFFF; --c-bahaya: #B3261E; --c-bahayaTeks: #8A2A20; --c-bahayaBg: #FDEBEA; --c-bahayaGaris: #E8A6A0; --c-emasTeks: #8A6A20; --c-emasBg: #FFF1D6; --c-emasGaris: #EBD79B; --c-biruTeks: #274C74; --c-biruBg: #E3EDF8; --c-toscaTeks: #1C5A52; --c-toscaBg: #DDF1EE; color-scheme: light; }
      html[data-tema="gelap"] { --c-green: #3E9468; --c-greenDeep: #1F5A3F; --c-gold: #D4A94C; --c-goldSoft: #3A3220; --c-mist: #0F1713; --c-leaf: #1E3027; --c-ink: #E6ECE7; --c-muted: #9DAAA2; --c-line: #2A3A31; --c-card: #17231D; --c-bahaya: #FF8A80; --c-bahayaTeks: #FFB4AB; --c-bahayaBg: #3A1F1D; --c-bahayaGaris: #7A3A34; --c-emasTeks: #E8C170; --c-emasBg: #3A3220; --c-emasGaris: #5A4A22; --c-biruTeks: #9CC1F0; --c-biruBg: #1D2D40; --c-toscaTeks: #7FD6C9; --c-toscaBg: #1B3535; color-scheme: dark; }
      html, body { background: var(--c-mist); color: var(--c-ink); }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--c-mist);
      }
      /* Ukuran & tampilan disamakan dengan layar logo bawaan Android (ikon aplikasi di tengah, tanpa bayangan),
         supaya perpindahan dari layar Android ke animasi ini tidak terasa -- logonya langsung "berdetak". */
      #app-splash-card {
        width: min(228px, 58vw);
        height: min(228px, 58vw);
        animation: app-splash-breathe 1.6s ease-in-out infinite;
      }
      #app-splash-card img {
        width: 100%;
        height: 100%;
      }
      /* Keluar: logo membesar sedikit sambil memudar (0,7 detik), lalu aplikasi terlihat. */
      #app-splash.app-splash-hide {
        pointer-events: none;
        animation: app-splash-pudar 0.7s ease-in forwards;
      }
      #app-splash.app-splash-hide #app-splash-card {
        animation: app-splash-besar 0.7s ease-in forwards;
      }
      @keyframes app-splash-pudar { to { opacity: 0; } }
      @keyframes app-splash-besar { from { transform: scale(1); } to { transform: scale(1.5); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash.app-splash-hide #app-splash-card { animation: none; }
      }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div id="app-splash-card">
        <img src="/icon-512.png" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
