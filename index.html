<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Guru — Kuttab Budi Ashari</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FBFAF7" />
    <style>
      html, body { background: #FBFAF7; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FBFAF7;
        transition: opacity 0.35s ease;
      }
      /* Ukuran & tampilan disamakan dengan layar logo bawaan Android (ikon aplikasi di tengah, tanpa bayangan),
         supaya perpindahan dari layar Android ke animasi ini tidak terasa -- logonya langsung "berdetak". */
      #app-splash-card {
        width: min(228px, 58vw);
        height: min(228px, 58vw);
        animation: app-splash-breathe 1.6s ease-in-out infinite;
      }
      #app-splash-card img {
        width: 100%;
        height: 100%;
      }
      #app-splash.app-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div id="app-splash-card">
        <img src="/icon-512.png" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
