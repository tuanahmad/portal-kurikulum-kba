<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Guru — Kuttab Budi Ashari</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C4A33" />
    <style>
      html, body { background: #FBFAF7; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FBFAF7;
        transition: opacity 0.35s ease;
      }
      #app-splash-card {
        width: 168px;
        height: 168px;
        border-radius: 38px;
        overflow: hidden;
        box-shadow: 0 8px 28px rgba(28, 74, 51, 0.16);
        animation: app-splash-breathe 1.6s ease-in-out infinite;
      }
      #app-splash-card img {
        width: 100%;
        height: 100%;
        mix-blend-mode: multiply;
        filter: brightness(1.04);
      }
      #app-splash.app-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div id="app-splash-card">
        <img src="/icon-192.png" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
